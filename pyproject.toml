[project]
name = "ghscan"
version = "0.1.0"
description = "Analyze GitHub profiles from your terminal"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
dependencies = ["httpx>=0.27", "pydantic>=2.7"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
ghscan = "ghscan.cli:main"

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["ghscan"]

[tool.pytest.ini_options]
testpaths = ["tests"]
